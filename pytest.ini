[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
xfail_strict = true
testpaths = tests
addopts = -ra -m "not browser"
markers =
    audit: 迁移/重构验收快照，行为不测代码结构（Brief 50 · 工单F.4，先注册，打标签在触碰 C/D/E 相关文件时顺手做）
    contract: 跨模块/跨仓契约测试（Brief 50 · 工单F.4）
    smoke: 轻量冒烟测试（Brief 50 · 工单F.4）
    browser: 实际浏览器交互验收，独立任务执行
    cross_repo: 需要相邻客户端仓库的契约测试
    windows_only: 只能在 Windows 验证的行为
    optional_extension: 依赖可选原生扩展的行为
filterwarnings =
    # Starlette's TestClient still emits this compatibility warning while it
    # bridges the installed httpx runtime; keep the allowlist category/module
    # narrow so project warnings remain visible and fail the focused checks.
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient
