name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release packages (Windows + macOS)
        run: python scripts/build_release.py --version ${{ github.ref_name }} --all-platforms
        env:
          # windows-latest 默认非 UTF-8 控制台代码页，脚本自身也会 reconfigure
          # stdout/stderr，这里再加一层保险。
          PYTHONUTF8: "1"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
