name: Tests

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  pytest:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # config.yaml is deliberately private and gitignored.  The smoke suite
      # must exercise the public fresh-clone contract, not a developer's local
      # character.default or credentials.
      - name: Prepare public fresh-clone configuration
        run: cp config.example.yaml config.yaml

      # The backend workflow does not checkout Emerald-client. Cross-repo
      # contract tests have a separate workflow and must be skipped here.
      - name: Configure isolated backend tests
        run: echo "SKIP_CROSS_REPO=1" >> "$GITHUB_ENV"

      # v0.1 smoke subset: keep a focused, public-asset-only regression suite.
      # A failure here is actionable; tests must not assume a private config or
      # character assets beyond config.example.yaml and tracked defaults.
      - name: Run v0.1 pytest smoke subset
        run: >
          python -m pytest -n 4 -q -ra -m smoke --strict-markers
          --junitxml=artifacts/smoke.xml

      - name: Reject unverified smoke tests
        run: python -m tests.ci_evidence artifacts/smoke.xml --no-skips

  full-pytest:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare public fresh-clone configuration
        run: cp config.example.yaml config.yaml

      - name: Configure isolated backend tests
        run: echo "SKIP_CROSS_REPO=1" >> "$GITHUB_ENV"

      - name: Run public full-pytest preflight
        run: python -m tests.ci_preflight

      - name: Run full pytest with junit evidence
        run: |
          mkdir -p artifacts
          python -m pytest -n 4 -q -ra --junitxml=artifacts/pytest-${{ matrix.python-version }}.xml

      - name: Classify skipped regression coverage
        run: python -m tests.ci_evidence artifacts/pytest-${{ matrix.python-version }}.xml

      - name: Verify state isolation without xdist
        run: >
          python -m pytest -q -ra tests/test_gmail_oauth.py
          tests/test_qq_fast_path_tool_loop.py tests/test_brief171_owner_turn_diary.py
          tests/test_turn_sink.py --junitxml=artifacts/serial.xml

      - name: Reject unverified state isolation
        run: python -m tests.ci_evidence artifacts/serial.xml --no-skips

      - name: Verify bounded business mutations are detected
        if: matrix.python-version == '3.12'
        run: python -m tests.run_quality_mutations

      - name: Upload full pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-pytest-${{ matrix.python-version }}
          path: |
            artifacts/*.xml
            .tmp/quality-mutations/
          if-no-files-found: error
          retention-days: 30

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix .tmp/browser playwright@1.58.2
      - run: .tmp/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run isolated admin browser contract
        env:
          NODE_PATH: ${{ github.workspace }}/.tmp/browser/node_modules
        run: python -m tests.run_admin_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-${{ github.sha }}
          path: .tmp/admin-navigation
          if-no-files-found: error
