<h1 class="page-title" data-i18n="settings_center.mail_connection">邮件连接</h1>
<div class="card">
  <div class="card-header"><h3>角色 Gmail 邮箱</h3><span id="setup-gmail-status" role="status"></span></div>
  <p>角色可以读取和发送邮件。读取的内容可能交给当前模型服务处理。管理面仅展示连接、同步及投递状态。</p>
  <div class="form-row">
    <label class="field"><span>角色的 Google 邮箱</span><input id="setup-gmail-email" type="email" maxlength="254"></label>
    <label class="checkbox-row"><input id="setup-gmail-consent" type="checkbox">我同意由配置的模型服务处理邮箱内容</label>
  </div>
  <div class="form-row">
    <label class="checkbox-row"><input id="setup-gmail-sync" type="checkbox" checked>同步新邮件</label>
    <label class="field"><span>同步间隔（秒，默认 300）</span><input id="setup-gmail-interval" type="number" required min="60" max="3600" value="300"></label>
  </div>
  <p id="setup-gmail-detail"></p>
  <details id="setup-gmail-unknown" hidden><summary>需要人工核查的投递</summary><p id="setup-gmail-unknown-ids"></p></details>
  <div class="modal-footer admin-inline-124">
    <button class="btn btn-primary" id="setup-gmail-connect" data-action="connectSetupGmail">连接 / 重新授权</button>
    <button class="btn btn-ghost" id="setup-gmail-test" data-action="testSetupGmail">测试连接</button>
    <button class="btn btn-ghost" id="setup-gmail-save" data-action="saveSetupGmailSync">保存同步设置</button>
    <button class="btn btn-ghost" data-action="loadSetupGmail">刷新</button>
    <button class="btn btn-ghost" id="setup-gmail-disconnect" data-action="disconnectSetupGmail">断开并撤销</button>
  </div>
</div>
<div class="card">
        <div class="card-header">
          <h3><span data-i18n="setup.mail.title">邮件通道</span> <span class="badge" data-i18n="common.optional">可选</span></h3>
          <span id="setup-mail-status" class="admin-inline-082"></span>
        </div>
        <p class="admin-inline-087">角色写信和梦境明信片的投递设置。</p>
        <div class="form-row">
          <label class="checkbox-row admin-inline-117">
            <input type="checkbox" id="setup-mail-enabled" class="admin-inline-202">
            <span data-i18n="setup.mail.enable">启用邮件通道</span>
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>smtp_host</span>
            <input type="text" id="setup-mail-host" placeholder="smtp.gmail.com">
          </label>
          <label class="field">
            <span>smtp_port</span>
            <input type="number" id="setup-mail-port" placeholder="587">
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>smtp_user</span>
            <input type="text" id="setup-mail-user" placeholder="发信邮箱账号" data-i18n-placeholder="setup.mail.user_placeholder">
          </label>
          <label class="field">
            <span>smtp_password <span id="setup-mail-password-state" class="admin-inline-077"></span></span>
            <input type="password" id="setup-mail-password" placeholder="留空=不修改已有值" data-i18n-placeholder="setup.secret.keep">
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>from_addr</span>
            <input type="text" id="setup-mail-from-addr" placeholder="发送邮箱地址" data-i18n-placeholder="setup.mail.from_addr_placeholder">
          </label>
          <label class="field">
            <span>from_name</span>
            <input type="text" id="setup-mail-from-name" placeholder="角色名" data-i18n-placeholder="setup.mail.from_name_placeholder">
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>to_addr</span>
            <input type="text" id="setup-mail-to-addr" placeholder="接收邮箱地址" data-i18n-placeholder="setup.mail.to_addr_placeholder">
          </label>
          <label class="field">
            <span>subject_prefix</span>
            <input type="text" id="setup-mail-subject-prefix" placeholder="【来信】" data-i18n-placeholder="setup.mail.subject_placeholder">
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>角色写信发信后端</span>
            <select id="setup-mail-backend">
              <option value="smtp">SMTP</option>
              <option value="gmail_api">Gmail API</option>
            </select>
          </label>
        </div>
        <div class="form-row col-1">
          <label class="field">
            <span data-i18n="setup.mail.connection_mode">SMTP 连接方式</span>
            <select id="setup-mail-connection-mode">
              <option value="auto" data-i18n="setup.mail.connection_auto">自动（有代理地址时使用代理）</option>
              <option value="direct" data-i18n="setup.mail.connection_direct">直连（绕过邮件代理）</option>
              <option value="proxy" data-i18n="setup.mail.connection_proxy">代理</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="setup.mail.proxy_label">proxy_url（可选，SMTP 端口被墙时用）</span>
            <input type="text" id="setup-mail-proxy-url" placeholder="http://127.0.0.1:7897">
          </label>
        </div>
        <div class="modal-footer admin-inline-124">
          <button class="btn btn-primary" data-action="saveSetupMail" data-i18n="common.save">保存</button>
        </div>
      </div>
