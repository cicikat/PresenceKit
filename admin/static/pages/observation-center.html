<h1 class="page-title" data-i18n="settings_center.observability">观测</h1>
<section class="card"><h3>IME 输入法接收</h3>
<p>接收与活动理解分别开关；启用理解后可产生角色主动候选，不把草稿当成已发送消息。显示最近更新三小时内的草稿；正文仅管理员可见，默认折叠。</p>
<div class="admin-action-group"><button class="btn btn-ghost" data-action="loadImeObservation">刷新接收记录</button><button class="btn btn-ghost" data-action="goto" data-action-args='["feature-center"]'>接收与理解开关</button><button class="btn btn-ghost" data-action="goto" data-action-args='["auth-tokens"]'>配对凭据</button></div>
<label>设备标识 <input id="ime-device-filter" placeholder="留空查看全部设备"></label>
<div id="ime-observation" aria-live="polite"></div>
<button id="ime-more" class="btn btn-ghost" data-action="loadImeObservation" data-action-args='[true]' hidden>加载更早记录</button></section>
<section class="card"><h3 data-i18n="settings_center.runtime_overview">运行总览</h3><div class="admin-action-group"><button class="btn btn-ghost" data-action="goto" data-action-args='["status"]'>系统状态</button><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-system-diagnosis"]' data-i18n="settings_center.blockers_and_diagnostics">阻断与诊断</button></div></section>
<section class="card"><h3 data-i18n="settings_center.conversation_and_generation">对话与生成</h3><div class="admin-action-group"><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-chatlog"]' data-i18n="settings_center.chat_history">聊天记录</button><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-prompt"]' data-i18n="settings_center.reality_prompts">现实提示词</button><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-dream-prompt"]' data-i18n="settings_center.dream_prompts">梦境提示词</button><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-dream-operations"]' data-i18n="settings_center.dream_sessions">梦境会话</button></div></section>
<section class="card"><h3 data-i18n="settings_center.tools_and_tasks">工具与任务</h3><div class="admin-action-group"><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-tools"]' data-i18n="settings_center.tool_execution_records">工具执行记录</button><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-char-permissions"]' data-i18n="settings_center.current_character_permissions">当前角色可用范围</button><button class="btn btn-ghost" data-action="goto" data-action-args='["observe-visual"]' data-i18n="settings_center.perception_records">感知记录</button><button class="btn btn-ghost" data-action="goto" data-action-args='["call-records"]' data-i18n="settings_center.call_and_task_records">调用与任务记录</button></div></section>
