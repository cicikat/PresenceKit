<h1 class="page-title" data-i18n="memory_dossiers.title">角色记忆档案</h1>
<div class="card">
  <div class="card-header"><h3 data-i18n="memory_dossiers.status">运行状态</h3><button class="btn btn-ghost btn-sm" data-action="loadMemoryConsolidationStatus" data-i18n="common.refresh">刷新</button></div>
  <div class="form-row">
    <label class="field"><span data-i18n="memory_dossiers.uid">用户 ID</span><input id="memory-consolidation-uid" type="text" autocomplete="off"></label>
    <label class="field"><span data-i18n="memory_dossiers.character">角色</span><select id="memory-consolidation-char"></select></label>
  </div>
  <div id="memory-consolidation-status" class="empty" data-i18n="memory_dossiers.not_loaded">尚未读取</div>
  <div class="admin-action-group">
    <button class="btn btn-primary" data-action="controlMemoryConsolidation" data-action-args='["start"]' data-i18n="memory_dossiers.start">启动</button>
    <button class="btn btn-ghost" data-action="controlMemoryConsolidation" data-action-args='["stop"]' data-i18n="memory_dossiers.stop">停止</button>
    <button class="btn btn-ghost" data-action="controlMemoryConsolidation" data-action-args='["pause"]' data-i18n="memory_dossiers.pause">暂停</button>
    <button class="btn btn-ghost" data-action="controlMemoryConsolidation" data-action-args='["resume"]' data-i18n="memory_dossiers.resume">继续</button>
    <button class="btn btn-danger" data-action="controlMemoryConsolidation" data-action-args='["revoke"]' data-i18n="memory_dossiers.revoke">撤销授权</button>
    <button class="btn btn-ghost" data-action="controlMemoryConsolidation" data-action-args='["recover_unknown"]' data-i18n="memory_dossiers.recover">核对并恢复</button>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="memory_dossiers.settings">整理配置</h3><button class="btn btn-primary btn-sm" data-action="saveMemoryConsolidationSettings" data-i18n="common.save">保存</button></div>
  <div class="form-row">
    <label class="checkbox-row"><input id="memory-consolidation-enabled" type="checkbox"><span data-i18n="memory_dossiers.enable">启用</span></label>
    <label class="field"><span data-i18n="memory_dossiers.night_start">夜窗开始</span><input id="memory-consolidation-start" type="number" min="0" max="23"></label>
    <label class="field"><span data-i18n="memory_dossiers.night_end">夜窗结束</span><input id="memory-consolidation-end" type="number" min="0" max="23"></label>
    <label class="field"><span data-i18n="memory_dossiers.idle_seconds">空闲秒数</span><input id="memory-consolidation-idle" type="number" min="60" max="86400"></label>
    <label class="field"><span data-i18n="memory_dossiers.batch_size">单批记录</span><input id="memory-consolidation-batch" type="number" min="1" max="100"></label>
    <label class="field"><span data-i18n="memory_dossiers.output_tokens">单次输出 token</span><input id="memory-consolidation-tokens" type="number" min="64" max="4000"></label>
  </div>
  <div class="form-row">
    <label class="field"><span data-i18n="memory_dossiers.daily_calls">每日调用</span><input id="memory-consolidation-calls" type="number" min="1" max="100"></label>
    <label class="field"><span data-i18n="memory_dossiers.daily_tokens">每日 token</span><input id="memory-consolidation-daily-tokens" type="number" min="64" max="100000"></label>
    <label class="field"><span data-i18n="memory_dossiers.daily_wall">每日墙钟秒数</span><input id="memory-consolidation-wall" type="number" min="1" max="86400"></label>
    <label class="field"><span data-i18n="memory_dossiers.background_preset">后台 preset</span><input id="memory-consolidation-preset" type="text" maxlength="128"></label>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="memory_dossiers.history">历史整理进度</h3><button class="btn btn-ghost btn-sm" data-action="loadMemoryHistoryReconciliation" data-i18n="common.refresh">刷新</button></div>
  <div id="memory-history-status" class="empty" data-i18n="memory_dossiers.history_not_loaded">尚未读取历史清单</div>
  <div class="admin-action-group">
    <button class="btn btn-ghost" data-action="createMemoryHistoryManifest" data-i18n="memory_dossiers.history_manifest">生成清单</button>
    <button class="btn btn-ghost" data-action="controlMemoryHistoryReconciliation" data-action-args='["pause"]' data-i18n="memory_dossiers.history_pause">暂停回填</button>
    <button class="btn btn-ghost" data-action="controlMemoryHistoryReconciliation" data-action-args='["resume"]' data-i18n="memory_dossiers.history_resume">恢复回填</button>
    <button class="btn btn-ghost" data-action="controlMemoryHistoryReconciliation" data-action-args='["freeze"]' data-i18n="memory_dossiers.history_freeze">冻结清单</button>
    <button class="btn btn-ghost" data-action="controlMemoryHistoryReconciliation" data-action-args='["calibrate"]' data-i18n="memory_dossiers.history_calibrate">隔离校准</button>
    <button class="btn btn-ghost" data-action="controlMemoryHistoryReconciliation" data-action-args='["admit"]' data-i18n="memory_dossiers.history_admit">冻结准入</button>
  </div>
  <div class="form-row">
    <label class="field"><span data-i18n="memory_dossiers.history_go_live">上线日期</span><input id="memory-history-go-live" type="date"></label>
    <label class="field"><span data-i18n="memory_dossiers.history_timezone">时区</span><input id="memory-history-timezone" type="text" maxlength="64" value="Asia/Shanghai"></label>
    <label class="field"><span data-i18n="memory_dossiers.history_stop_local">晨间停止</span><input id="memory-history-stop-local" type="time" value="07:00"></label>
    <label class="field"><span data-i18n="memory_dossiers.history_cost_budget">每日费用上限</span><input id="memory-history-cost-budget" type="number" min="0.01" max="10000" step="0.01" value="1"></label>
  </div>
  <div class="form-row">
    <label class="field"><span data-i18n="memory_dossiers.history_store">来源库</span><input id="memory-history-store" type="text" maxlength="64"></label>
    <label class="field"><span data-i18n="memory_dossiers.history_status">处理状态</span><input id="memory-history-item-status" type="text" maxlength="32"></label>
    <label class="field"><span data-i18n="memory_dossiers.history_source_id">来源 ID</span><input id="memory-history-source-id" type="text" maxlength="512"></label>
  </div>
  <div class="admin-action-group">
    <button class="btn btn-ghost btn-sm" data-action="searchMemoryHistorySourceItems" data-i18n="memory_dossiers.history_search">查询判定</button>
  </div>
  <div id="memory-history-items" class="empty" data-i18n="memory_dossiers.history_no_items">暂无源项</div>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="memory_dossiers.query">档案查询</h3><button class="btn btn-ghost btn-sm" data-action="searchMemoryConsolidationDossiers" data-i18n="memory_dossiers.search">搜索</button></div>
  <div class="form-row"><label class="field"><span data-i18n="memory_dossiers.keyword">关键词</span><input id="memory-consolidation-query" type="search" maxlength="256"></label></div>
  <div id="memory-consolidation-dossiers" class="empty" data-i18n="memory_dossiers.no_results">暂无结果</div>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="memory_dossiers.detail">档案详情</h3></div>
  <pre id="memory-consolidation-detail" class="raw-output" data-i18n="memory_dossiers.select_one">选择一条档案</pre>
</div>
