<div class="page-shell">
  <div class="page-header">
    <h1 class="page-title" data-i18n="existence.title">存在总览</h1>
    <p class="page-subtitle" data-i18n="existence.subtitle">把当前角色持续存在相关的状态放在一起看。</p>
  </div>
  <div class="grid grid-2">
    <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-mood"]'>
      <strong data-i18n="existence.mood.title">情绪与花园</strong>
      <span data-i18n="existence.mood.description">查看当前情绪、花园状态与异常提示。</span>
    </button>
    <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-dream"]'>
      <strong data-i18n="existence.dream.title">梦境状态</strong>
      <span data-i18n="existence.dream.description">查看现实 / 梦境 / 挽留 / 冷却等状态。</span>
    </button>
    <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-memory-summary"]'>
      <strong data-i18n="existence.memory.title">记忆</strong>
      <span data-i18n="existence.memory.description">查看层级摘要、来源隔离和召回可用性。</span>
    </button>
    <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-growth"]'>
      <strong data-i18n="existence.growth.title">成长</strong>
      <span data-i18n="existence.growth.description">查看近期练习、兴趣和作品摘要。</span>
    </button>
    <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-visual"]'>
      <strong data-i18n="existence.visual.title">视觉</strong>
      <span data-i18n="existence.visual.description">查看视觉资源与观测结果。</span>
    </button>
    <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-spend"]'>
      <strong data-i18n="existence.spend.title">支出</strong>
      <span data-i18n="existence.spend.description">查看台账与消耗情况。</span>
    </button>
  </div>
</div>

<section class="card">
  <h2 data-i18n="drinking.title">酒意（虚构体感）</h2>
  <pre id="drinking-state"></pre>
</section>
