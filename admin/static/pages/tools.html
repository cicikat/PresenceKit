<h1 class="page-title" data-i18n="tools.title">工具</h1>

<div class="card">
  <h3>小红书分享读取</h3>
  <p>读取帖子正文、图片和评论样本。需先运行并登录 xiaohongshu-mcp 读取服务；图片使用已有图片识别配置。</p>
  <label><input id="xhs-enabled" type="checkbox">允许读取小红书分享</label>
  <label class="field">读取服务地址<input id="xhs-reader-url" type="url" placeholder="http://127.0.0.1:18060"></label>
  <label class="field">评论数量上限<input id="xhs-max-comments" type="number" min="1" max="30" value="10"></label>
  <label class="field">图片识别上限（0为不识别）<input id="xhs-max-images" type="number" min="0" max="4" value="2"></label>
  <button class="btn btn-primary" data-action="saveXiaohongshuSettings">保存小红书设置</button>
  <p id="xhs-settings-status" role="status"></p>
</div>

<div class="card">
  <p data-i18n="tools.notice">这里管理内置已注册工具的运行开关，以及每个聊天模型实际收到的工具 schema。</p>
  <p id="tools-mcp-status" class="tools-status-note"></p>
  <p id="tools-intiface-status" class="tools-status-note"></p>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="tools.binding_title">模型工具预设</h3><button class="btn btn-ghost btn-sm" data-action="loadToolsPage" data-i18n="common.refresh">刷新</button></div>
  <div class="form-row">
    <label class="field"><span data-i18n="tools.model">聊天模型 preset</span><select id="tools-model-preset" onchange="changeToolsModelPreset(this.value)"></select></label>
  </div>
  <p id="tools-binding-note" class="tools-status-note"></p>
  <div id="tools-preset-buttons"></div>
  <div class="tools-action-row">
    <button id="tools-save-preset" class="btn btn-primary btn-sm" data-action="saveToolPreset" data-i18n="tools.save_preset">保存当前勾选</button>
    <button class="btn btn-ghost btn-sm" data-action="createToolPreset" data-i18n="tools.create_preset">新建预设</button>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="tools.registry_title">已注册工具</h3><span id="tools-exposure-count" class="badge"></span></div>
  <p data-i18n="tools.registry_hint" class="tools-status-note">“在此模型中暴露”只影响工具循环传给当前聊天模型的 schema；全局执行开关关闭后，任何模型都不能调用该内置工具。</p>
  <div id="tools-registry-list"><div class="loading" data-i18n="common.loading">加载中…</div></div>
</div>

<div class="card">
  <div class="card-header"><h3 data-i18n="tools.path_title">路径工具类别</h3><button class="btn btn-primary btn-sm" data-action="savePathExposure" data-i18n="tools.save_path">保存类别</button></div>
  <p class="tools-status-note" data-i18n="tools.path_hint">Path A 对 QQ、desktop、mobile 统一生效；Path C 仅控制工具循环。角色卡可进一步覆盖这两个全局默认值。</p>
  <div id="tools-path-exposure"><div class="loading" data-i18n="common.loading">加载中...</div></div>
</div>
