<h1 class="page-title" data-i18n="settings_center.coplay_game_detection">陪玩检测名单</h1><div class="card">

        <button type="button" class="btn btn-ghost btn-sm" data-action="refreshSetupCoplayStatus" data-i18n="common.refresh">刷新采集状态</button>
        <div id="setup-coplay-games-list"></div>
        <button type="button" class="btn btn-ghost btn-sm" data-action="addSetupCoplayGame">Add game</button>
        <div class="modal-footer admin-inline-124">
          <button class="btn btn-primary" data-action="saveSetupCoplayGames" data-i18n="common.save">保存</button>
        </div>
