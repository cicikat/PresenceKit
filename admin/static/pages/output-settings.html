<h1 class="page-title" data-i18n="settings_center.sticker_output">表情包输出</h1><div class="card">
  <div class="card-header"><h3 data-i18n="status.sticker.title">表情包</h3><button class="btn btn-ghost btn-sm" data-action="loadStickerConfig" data-i18n="common.refresh">刷新</button></div>
  <div class="form-row">
    <label class="checkbox-row admin-inline-117"><input type="checkbox" id="sticker-enabled" class="admin-inline-202"><span data-i18n="status.sticker.enable">启用</span></label>
    <label class="field"><span data-i18n="status.sticker.trigger_prob">触发概率（0–1）</span><input type="number" id="sticker-trigger-prob" min="0" max="1" step="0.01" value="0.06"></label>
  </div>
  <div class="config-item-meta"><span data-i18n="runtime_config.source_global">来源：全局 sticker 配置</span><span data-i18n="runtime_config.apply_reload">保存后热重载</span></div>
  <button class="btn btn-primary btn-sm" data-action="saveStickerConfig" data-i18n="common.save">保存</button>
</div>
