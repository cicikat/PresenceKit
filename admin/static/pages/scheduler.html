
      <h1 class="page-title" data-i18n="scheduler.title">调度器</h1>
      <p class="admin-source-hint" data-i18n="scheduler.hint">查看例行触发状态与主动发言账本；新版的调度配置在自主活动安排中。</p>

      <div class="card" id="scheduler-config-card">
        <div class="card-header"><h3 data-i18n="scheduler.config_title">调度配置</h3><button class="btn btn-primary btn-sm" data-action="saveSchedulerConfig" data-i18n="common.save">保存</button></div>
        <div id="sc-config-switches" class="admin-inline-033"></div>
        <div class="form-row admin-inline-158">
          <label class="field"><span data-i18n="scheduler.presence_minutes">存在感提醒（分钟）</span><input type="number" min="1" id="sc-presence-minutes"></label>
          <label class="field"><span data-i18n="scheduler.gap_hours">主动消息最小间隔（小时）</span><input type="number" min="0.1" max="24" step="0.1" id="sc-gap-hours"></label>
          <label class="field"><span data-i18n="scheduler.daily_proactive">每日主动消息上限</span><input type="number" min="1" max="64" id="sc-daily-proactive"></label>
        </div>
        <p><span data-i18n="scheduler.shared_owner">使用全局所有者资料，无需重复填写。</span> <button class="btn btn-ghost btn-sm" data-action="goto" data-action-args='["setup"]' data-i18n="scheduler.edit_owner">管理所有者资料</button></p>
      </div>
      <!-- 触发状态 -->
      <div class="card">
        <div class="card-header">
          <h3 data-i18n="scheduler.trigger_status">触发器状态</h3>
          <button class="btn btn-ghost btn-sm" data-action="loadScheduler" data-i18n="common.refresh">刷新</button>
        </div>
        <div id="sc-status-table"><div class="loading" data-i18n="common.loading">加载中…</div></div>
      </div>

      <!-- ProactiveLedger：统一发送预算与记账（CC 任务 19 · B） -->
      <div class="card">
        <div class="card-header">
          <h3 data-i18n="scheduler.ledger_title">主动发言账本</h3>
          <button class="btn btn-ghost btn-sm" data-action="loadProactiveLedger" data-i18n="common.refresh">刷新</button>
        </div>
        <div id="sc-ledger-body" class="admin-inline-098" data-i18n="common.loading">加载中…</div>
      </div>

      <div class="card" id="hds-config-card" data-hide-settings-functions>
        <div class="card-header"><h3 data-i18n="scheduler.hds.title">HDS 本地实时心率</h3><button class="btn btn-primary btn-sm" data-action="saveHdsLocalSettings" data-i18n="common.save">保存</button></div>
        <div class="form-row">
          <label class="checkbox-row"><input type="checkbox" id="hds-enabled"><span data-i18n="scheduler.hds.enabled">启用本地接收</span></label>
          <label class="checkbox-row"><input type="checkbox" id="hds-character-read"><span data-i18n="scheduler.hds.character_read">允许角色读取心率</span></label>
          <label class="field"><span data-i18n="scheduler.hds.port">接收端口</span><input type="number" id="hds-port" min="1024" max="65535"></label>
          <label class="field"><span data-i18n="scheduler.hds.interface">手表所在网卡</span><select id="hds-interface"></select></label>
          <label class="field"><span data-i18n="scheduler.hds.source_mode">允许来源</span><select id="hds-source-mode"><option value="auto" data-i18n="scheduler.hds.auto">自动：选中网卡同网段</option><option value="manual" data-i18n="scheduler.hds.manual">手动填写网段</option></select></label>
        </div>
        <label class="field" id="hds-subnets-row" style="display:none"><span data-i18n="scheduler.hds.subnets">允许网段（每行一个 CIDR）</span><textarea id="hds-subnets" rows="2"></textarea></label>
        <p><span id="hds-url" class="admin-source-hint"></span> <button class="btn btn-ghost btn-sm" data-action="copyHdsAddress" data-i18n="scheduler.hds.copy">复制地址</button></p>
        <p id="hds-effective" class="admin-source-hint"></p>
        <p id="hds-latest" class="admin-source-hint"></p>
        <p id="hds-reads" class="admin-source-hint"></p>
      </div>
