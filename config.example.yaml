  retain_raw_uploads: false
  read_watch:
    enabled: true
  get_profile:
    enabled: true
  get_episodic:
    enabled: true
  desktop_minimize:
    enabled: true
  desktop_open_url:
    enabled: true
  desktop_play_pause:
    enabled: true
  desktop_notify:
    enabled: true
  play_song:
    enabled: true
  device_shutdown:
    enabled: false
  device_sleep:
    enabled: false
  exit_yandere:
    enabled: true
  peek_screen_content:
    enabled: true
  toy_vibrate:
    enabled: false
  toy_stop:
    enabled: false
  toy_pattern:
    enabled: false
  toy_job_status:
    enabled: false
dream:
  scenario:
    full_script_max_stages: 12
    full_script_max_tokens: 6000
    full_script_max_chars: 24000
    reconciler_timeout_s: 8       # 后台语义校准单次墙钟上限；不阻塞可见回复
    reconciler_max_concurrency: 2 # 同时运行的 scenario_reconcile 上限
    reconciler_stall_turns: 2     # 连续停滞达到该轮数后才触发校准
  impression:
    forced_rounds: 3        # 出梦后强制连续注入轮数（精确现实回合数，非时间窗）
    recall_enabled: true    # 强注结束后启用话题召回；false = 强注完即沉默
watch:
  fresh_days: 3             # 3.6_watch 睡眠摘要最大新鲜度；超过即不注入
sticker:
  enabled: true        # 总开关
  trigger_prob: 0.06   # 触发概率 0~1
tts:
  # `provider` defaults to gsv. Existing top-level GSV fields remain valid and
  # are automatically mapped to providers.gsv when that block is absent.
  provider: gsv
  providers:
    # Optional new-style block. Omit it to continue using the legacy fields below.
    gsv: {}
    # Reserved configuration slot only; no cloud protocol is assumed or activated.
    openai_compatible:
      api_url: ''
      api_key: ''
      model: ''
      voice: ''
  enabled: false  # 纯增值功能(QQ 概率语音)，默认关；依赖本机部署的 GPT-SoVITS，面板「系统状态」页可开
  desktop_enabled: false  # 桌面端按需语音条；独立于 QQ 概率语音，默认关闭
  # Per-surface automatic playback. All default to false so clients never
  # synthesize audio or consume mobile data without an explicit opt-in.
  auto_play:
    chat: false
    dream: false
    video_call: false
    desktop_pet: false
    mobile: false
  probability: 0.1
  api_url: http://127.0.0.1:9872
  top_k: 15
  top_p: 1.0
  temperature: 1.0
  sample_steps: 8
  pause_second: 0.3
  how_to_cut: 按中文句号。切
  # GSV v2 may lose the start of an internally split sentence.  By default the
  # adapter segments locally, sends each part with "不切", then joins PCM WAVs.
  # Newlines (including literal \\n or /n) and 。！？；…… are hard boundaries;
  # commas/dashes are only used to shorten a segment that exceeds this limit.
  external_segment_enabled: true
  segment_max_chars: 42
  segment_pause_seconds: 0.25
  ref_free: false
  if_freeze: false
  if_sr: false
  ref_audio: userdata/characters/authored/角色id/voice/default.wav
  # 留空时 GSV 切到对应默认底模；填写时可用相对路径或 GSV 已注册的模型 ID。
  gpt_model_path: ''       # 例：example.ckpt
  sovits_model_path: ''    # 例：example.pth
  gpt_model_fallback: 不训练直接推v3底模！
  sovits_model_fallback: 不训练直接推v2ProPlus底模！
  prompt_text: ''
  speed: 1.0
  emotion_enabled: true
  emotions:
    neutral:
      ref_audio: userdata/characters/authored/角色id/voice/neutral.wav
      prompt_text: ''
      speed: 1
    happy:
      ref_audio: userdata/characters/authored/角色id/voice/happy.wav
      prompt_text: ''
      speed: 1.1
    sad:
      ref_audio: userdata/characters/authored/角色id/voice/sad.wav
      prompt_text: ''
      speed: 0.9
    gentle:
      ref_audio: userdata/characters/authored/角色id/voice/gentle.wav
      prompt_text: ''
      speed: 0.95
    surprised:
      ref_audio: userdata/characters/authored/角色id/voice/surprised.wav
      prompt_text: ''
      speed: 1.05
    angry:
      ref_audio: userdata/characters/authored/角色id/voice/angry.wav
      prompt_text: ''
      speed: 1.1
hardware:
