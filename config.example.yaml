  intiface_opt_in: false  # Brief 151: dormant reserve; explicit opt-in required
  buttplug_ws: ws://127.0.0.1:12345
  max_job_duration_ms: 900000  # 单个后台硬件动作最长 15 分钟
# 爱意探针命中时请求板子画爱心，独立于 hardware（振动等）之外的具身反馈通道
embodiment:
  heart:
    enabled: false
    cooldown_sec: 45     # 同一角色两次画爱心之间的最短间隔
    duration_ms: 4000    # 单次爱心显示时长
mail:
  enabled: false  # 纯增值功能(角色写信)，默认关；面板「通道开关」可开，需自备 SMTP 凭据
  smtp_host: smtp.gmail.com
  smtp_port: 587
  proxy_url: http://127.0.0.1:YOUR-端口
  smtp_user: YOUR-接收的邮箱
  smtp_password: YOUR-邮箱通行密码
  from_addr: YOUR-发送的邮箱
  from_name: 角色名
  to_addr: YOUR-邮箱
  subject_prefix: 【来信】
plugins:
  voice:
    enabled: false
    mode: local
    local_url: http://127.0.0.1:9880
  image:
    enabled: false
    mode: local
    local_url: http://127.0.0.1:7860
logging:
  console_quiet: true   # true=只 WARNING+ 上控制台 + 丢成功 access；false=恢复啰嗦
# ── 语义 Embedding（向量召回，见 docs/vector-store.md）─────────────────────────
# 不配此块时，向量召回自动关闭，退回关键词路径（fail-open）。
embedding:
  provider_kind: openai_compat          # 阶段 A：OpenAI 兼容 /embeddings 端点
  base_url: https://your-embedding-endpoint/v1
  api_key: YOUR_EMBEDDING_KEY           # 真 key 只进 config.yaml（已 gitignore）
  model: bge-m3                          # 或任意中文 embedding 模型
  dim: 1024                              # 必须与 model 输出维度一致
# ── 召回融合权重（X2，见 docs/vector-store.md）────────────────────────────────
# score = w_sem*semantic_sim + w_kw*keyword_relevance + w_strength*(strength*decay)
# 三权重之和建议≈1.0；无 embedding 时 w_sem 项自动为 0（fail-open）。
recall:
  weights:
    sem: 0.4         # 语义相似度权重
    kw: 0.3          # 关键词相关度权重
    strength: 0.3    # 强度×衰减权重
  batch_size: 32

screen_peek:
  enabled: false           # 默认关；在设置页打开后他可自主查看屏幕内容
  cooldown_minutes: 30     # 同一文件/窗口最短间隔分钟数（范围 5–240）

# Brief 56: local VLM shadow observation. Disabled by default; images never persist.
visual_perception:
  enabled: false
  base_url: ""
  model: ""
  api_key: ""
  timeout_s: 20

# Brief 57: notification-only API credit monitoring. No automatic payment exists.
spend:
  enabled: false
  daily_cap: 0             # 0 = 全禁（fail-closed），不是无限额
  monthly_cap: 0           # 0 = 全禁（fail-closed），不是无限额
  payee_whitelist: []
  # Put the following block in config.yaml when enabling it.
  # topup_amount is a reminder proposal only; it is never executed.
  # aliyun_bss:
  #   access_key_id: "YOUR_DEDICATED_RAM_ACCESS_KEY_ID"
  #   access_key_secret: "YOUR_DEDICATED_RAM_ACCESS_KEY_SECRET"
  # balance_providers:
  #   - name: aliyun_bss
  #     kind: aliyun_bss
  #     threshold: 50.00
  #     balance_field: available_cash_amount  # or available_amount
  #     topup_amount: 100.00
  #     timeout_s: 10
  #     topup_url: "https://usercenter2.aliyun.com/home"
  balance_providers: []

# Briefs 58-61: slow character growth. The whole subsystem is opt-in.
practice:
  enabled: false
  daily_sessions: 1
  reviewer_category: consolidation  # routing profile category；默认复用后台整合模型
  # reviewer_preset: deepseek-default  # 可选：严格直连同名 preset；未知名字会明确失败
  help_proposer: true

presence:
  growth_activity_prob: 0.3  # 近20h确有练习时，当下活动混入 growth 来源的概率

# Media MCP servers listed here gain level-based exposure. Unlisted servers
# remain ordinary organ-like tools and preserve their current behavior.
mcp_proficiency: {}        # tiers 每档须列全量工具；高档不自动继承低档工具

action_trace:
  enabled: true              # 关闭后不记录、不注入，零行为变化（回滚开关）
  inject_max_items: 5        # 层 10.5 最多注入几条痕迹
  inject_window_hours: 24    # 只注入这个时间窗内的痕迹
  event_log_echo: true       # status=ok 时是否回流一条到 event_log（供日记/往事检索看见）

# Brief 28 · tool loop 多步工具执行器：只在 chat preset 为 function_calling 模式的
# owner 真实私聊（QQ / desktop）生效，小模型 xml_fallback / 探针路径零改动。
# enabled: false 即完全回到现状（所有分支都在 tool_loop_active() 判断之后）。
tool_loop:
  enabled: false
  max_steps: 5               # 单轮最多调用工具的步数，前端可调 1-8
  total_timeout_s: 720       # 整个 loop 墙钟超时，超时按步数耗尽处理
  categories: ["info", "desktop", "memory"]
  exclude_tools: ["toy_vibrate", "toy_stop", "toy_pattern", "write_toy_file"]  # 硬件写类默认排除
  nudge_hint: true           # 首步注入"别凭记忆编造，需要就调工具"的软提示（Brief 29 · 5）

# Brief 32 · 内部思考链：主生成前一段不输出给用户的内心思考，缓解"不带思考有些生硬"。
# 两条路按 preset 能力自动选（mode: auto）：preset.reasoning_native=true → native
# （extra_body 逃生舱直通网关，见 model_presets.presets.deepseek-reasoner 示例）；
# 否则 → monologue（一次轻量调用产出内心活动，注入当轮 messages 尾部，用完即弃）。
# 铁律：思考内容永不进 short_term history / 广播 / event_log。
thinking:
  enabled: false             # 总开关，默认关
  character_voice: true      # 角色心声文风引导；随总开关生效，非原生思考区独立 prompt
  mode: auto                 # auto | native | monologue
  monologue_max_tokens: 200
  apply_to_proactive: false  # scheduler 主动消息是否也思考（默认省钱不开）

# MCP（Model Context Protocol）外部工具客户端。
# 只接外部工具，不接 resources/prompts 或外部记忆库。工具只经 Path C tool loop 暴露；
# categories 含 "mcp" 只控制模型能否看见 MCP 工具，不能代替下面的本地副作用策略。
mcp_servers:
  enabled: false                  # 总开关；关闭时不会建立任何 MCP session
  require_local_policy: true      # true=启用的 server 必须有非空 allow_tools + 完整 tool_policy
  # effect 只信任本地配置：
  #   read      = 只读，不确认
  #   write     = 改外部状态，默认不确认；可显式 require_confirm: true
  #   actuate   = 控制实体/设备，默认确认；可显式 require_confirm: false
  #   emergency = 立即停止/保护动作，永不确认
  # 远端 annotations.readOnlyHint 仅记录与观测，不能授予 read 权限；本地 effect 优先。
  servers:
    # 分类 A：普通外部服务（读 + 写）。write 工具仍是合法 MCP 能力，不要因 effect=write 删除它。
    - name: example_forum
      transport: streamable-http   # stdio | sse | streamable-http（http 为兼容别名）
      url: https://mcp.example.invalid/mcp
      headers: {Authorization: "Bearer ${EXAMPLE_MCP_TOKEN}"}  # 不写真实 token
      use_proxy: false             # 仅远程 server 可设 true；loopback 始终直连
      enabled: false               # per-server 开关；总开关仍由 mcp_servers.enabled 控制
      tool_timeout_s: 30
      # 可选客户端扩展，不是 MCP 官方分类标准。未配置时仍按普通 category="mcp" 使用。
      metadata_mapping:
        namespace: "io.example/tool"
        schema_versions: [1]
        schema_version_field: "schema_version"
        domains_field: "domains"
        interaction_field: "interaction"
      # exact remote tool name 覆盖；删除该项后重新使用远端分类。
      metadata_overrides:
        create_reply:
          mode: override            # remote | override | ignore
          domains: [forum_write]
      # 只收窄已经通过 allow_tools/local policy 的本轮 schema，不授予权限。
      domain_selector:
        domains: [forum_read, forum_write]
        include_unclassified: true  # 默认兼容无 metadata 的普通 MCP server
      allow_tools:                 # strict policy 下不可为空；远端多余工具会被忽略
        - list_threads
        - create_reply
      tool_policy:
        list_threads:
          effect: read
        create_reply:
          effect: write

    # 分类 B：具身硬件。actuate 默认确认；emergency 是无条件立即执行的停止动作。
    - name: example_hardware
      transport: streamable-http
      url: http://127.0.0.1:8766/mcp
      headers: {Authorization: "Bearer ${HARDWARE_MCP_TOKEN}"}
      use_proxy: false
      enabled: false
      tool_timeout_s: 30
      allow_tools:
        - hardware_status
        - hardware_pulse
        - hardware_stop
        - hardware_sequence
      tool_policy:
        hardware_status:
          effect: read
        hardware_pulse:
          effect: actuate
          require_confirm: true
        hardware_stop:
          effect: emergency
      tool_timeouts_s:
        hardware_sequence: 660  # 600s 最长序列 + 连接/收尾余量

  # 兼容模式：删除/设为 false 后保留旧 MCP 注册行为，但会记录 legacy unclassified policy 警告。

# fs 只读浏览工具（Brief 31）：fs_list / fs_read，只读，范围严格限于 allow_roots。
# 与 MCP 同策略——只经 tool loop 暴露，角色卡 presence_ext.tool_categories 含 "fs" 才看得见。
fs_access:
  enabled: false                  # 总开关，默认关
  allow_roots: []                  # 只读允许根，绝对路径，用户手填，如 "D:/some/dir"
  deny_names:                      # 命中即拒（对路径任一段做大小写不敏感子串匹配）
  - secrets
  - .env
  - .git
  - node_modules
  - __pycache__
  - config.yaml
  - token
  max_read_chars: 4000            # 单次读取截断
  max_list_entries: 100           # 单次列目录条数上限

# 受控 workspace 文件能力（Brief 233）：显式根目录与分操作权限，默认关闭。
workspace_access:
  enabled: false
  roots: []
  permissions:
    read: true
    list: true
    create: false
    update: false
    delete: false
  max_file_bytes: 5242880
  max_total_bytes: 52428800
  max_concurrent_tasks: 2
  max_read_chars: 10000
  max_list_entries: 100

# Browser automation is an opt-in local experiment. Keep disabled until a
# separately reviewed worker adapter, domain allowlist, and owner confirmation
# flow are configured.
browser:
  enabled: false
  allowed_domains: []
  download_enabled: false
  upload_enabled: false
  max_page_chars: 12000
  max_links: 30
  worker_timeout_seconds: 60
  adapter: none

mode: production
standalone_mode: false
data_prefix: "data"
memory:
  short_term_rounds: 50
  short_term_disk_rounds: 80
  group_context_lines: 50
  group_context_keep_latest: 3   # 末尾 N 条无条件保留（保连贯）
  group_context_top_k: 5         # 相关消息最多取 K 条
  group_context_min_score: 0.3   # 低于此分的消息过滤掉
  rag_top_k: 5
  rag_score_threshold: 0.6
  summary_every_n_rounds: 20
episodic:
  two_hop_enabled: false   # 默认关；置 true 开二跳做对比测试
anti_collapse:
  enabled: true            # 字数坍缩纠偏总开关
  short_max: 60            # 字符数 < 60 为短句，>= 60 为长句（单边界，只分两挡）
  recent_n_long: 4         # 近 4 条全为长句 → 触发（长句易触发，模型爱往注水长句坍缩）
  recent_n_short: 7        # 近 7 条全为短句 → 才触发（短句难触发，短句反而更像活人）
  prefix_retry: true       # 输出仍以检测到的重复句首开头时，追加强指令重试 1 次（硬止血）
  hint_rounds: 3           # 长度/分段提示触发后连续注入的轮数（per-uid 内存计数器，重启丢失可接受）
  segment_min_len: 40      # 分段坍缩阈值：无换行且字数超过此值才计一次"未分段"命中
  segment_recent_n: 2      # 连续几轮命中"未分段"才触发分段提示（同样延续 hint_rounds 轮）
  # 旧键 recent_n / thresholds 已废弃，读到时忽略并打 warning，不做自动迁移
output:
  segment_enforce:
    enabled: false          # 发送副本段落硬兜底（含桌面流式 delta）；默认关，便于 A/B 对比
    min_len: 40             # 缺省时回退 anti_collapse.segment_min_len
pseudo_stream:
  # 服务器端伪流式打字机回放（Brief 84）：Stage 群聊 / 梦境 / coplay 活动聊天复用
  # 1v1 已有的 message_stream_* 帧，整段回复按块打字机式回放；不影响 1v1 真流式。
  enabled: true            # 总开关
  block_min_chars: 2       # 句内分块最小字数
  block_max_chars: 6       # 句内分块最大字数
  interval_min_ms: 30      # 块间间隔下限
  interval_max_ms: 80      # 块间间隔上限
  max_duration_ms: 4000    # 单条消息回放总时长上限，超长文本自动加速收敛到该值
  profiles:
    dream:                 # 梦境模式更慢一档，贴合气氛
      interval_min_ms: 50
      interval_max_ms: 120
      max_duration_ms: 5000
context:
  max_turns: 30
chat:
  mode: chat
  style: chat
  multi_message: true
stage:
  # Brief 85「明确不做」：后台自发群聊/小剧场占位。默认关闭，未实现；
  # 未来若开必须走 ProactiveLedger + 每日上限，不能绕开 owner 触发的回波窗口。
  idle_theater: false
private_exchange:
  # Brief 86：深夜/闲时低频角色间私聊（受限形态，DESIGN.md 决策9.5 修订版）。
  # 产物只回流关系层（char_relations + 12h presence 提示），全文不进五大记忆库/
  # event_log/向量库，只落 data/runtime/groups/_private/ 供管理面板只读查看。
  enabled: true
  daily_limit: 1    # 每日会话数上限（跨所有角色对合计），按逻辑日重置
  max_turns: 6       # 单次会话 LLM 调用硬上限（双方轮流，各 ≤3 轮）
  window: deep_night # 触发窗口；v1 仅实现 deep_night（同 memory_janitor 时段判断）
group_chat:
  min_responders: 1
  max_responders: 2
  max_ai_chain_depth: 2
  respond_threshold: 0.5
  spontaneous_threshold: 0.7
  addressed_exclusive: false
  transcript_limit: 200
  memory_strength:
    solo: 1.0
    group: 0.7
    trigger: 0.4
  debug_token_log: true
  # Brief 85 §3/§4：短反应形态 + 话题引子。
  speak_threshold: 0.5
  react_threshold: 0.25
  max_reactions: 2
  topic_seed_prob: 0.25
diary:
  obsidian_path: 日记路径
  characters:
  - 角色名
retention:
  inbox:
    max_age_days: 7
  image_cache:
    max_age_days: 30
    max_files: 500
  dead_letter_queue:
    max_files: 200
  reminders:
    prune_done_days: 30
  dreams_archive:
    max_files: 200
  observations:
    max_raw: 100
coplay:
  # 部署级开关："是否允许陪玩功能存在"，不是运行时开关——运行时是否真正轮询由
  # 用户在前端"游戏模式"开关驱动的状态机（armed/off）决定，这里默认 true。
  # 只有完全不想部署此功能时才设 false，此时 /coplay/arm 会返回 409。
  enabled: true
  pet_launch_cmd: ''
  poll_interval: 10
  game_whitelist: []
  steam_library_paths: []
  screenshot_interval: 8
character:
  default: default
  name: 角色名
  consistency_check_every_n: 15
# 用户显示名（可选）：梦境等 prompt 层用它称呼用户；留空则用无名称写法（只用"你"）。
user:
  display_name: ""
# 自定义纪念日（可选，面板「配置」页可选层可编辑）：letter_writer/festival 消费，命中当天时
# 优先于硬编码节日。角色卡若自带 anniversaries 字段则完全覆盖这里（不合并）。
# 字段：key 唯一标识；month/day 日期；year_start 可留空（留空 = 每年都当作第 0 年，只用
# prompt_zero）；填具体年份则从第二年起改用 prompt_years（可含 {char}/{years} 占位符）。
anniversaries: []
# - key: first_date
#   month: 6
#   day: 14
#   year_start: 2024
#   prompt_zero: 今天是你们认识的日子
#   prompt_years: 在一起{years}年了
session:
  timeout_minutes: 10
scheduler:
  # Keep proactive evaluation off until the owner has explicitly configured it.
  enabled: false
  overflow_trigger: true
  presence_nag: true
  presence_nag_minutes: 60
  activity_level: high
  # 必填②（面板「配置」页同步标红）：留空 = 未配置，主动触发调度器会静默跳过，且 desktop/standalone
  # 场景下记忆文件会挂在错误/缺省 uid 下。建议直接填你的 QQ 号——若此处用了别的 id，之后接 QQ 时会
  # 按 QQ 号另起一套记忆，与桌宠期记忆不互通。仅接受 A-Za-z0-9_- 字符。
  owner_id: ''
  # 可选，格式 MM-DD（如 04-24）；留空或保持占位符 MM-DD 视为未填，不会触发生日相关主动消息。
  owner_birthday: MM-DD
  morning_greeting: true
  night_reminder: true
  random_message: true
  like_enabled: true
  moments_enabled: true
  signature_enabled: true
  signatures:
  - 示例签名文字  # 可填多条，角色会轮换展示
  daily_journal: true
  period_reminder: true
  diary_reminder: true
  diary_inject: true
  timenode: true
  festival: true
  holiday_boost: true
  sensor_aware:
    enabled: true
    tick_interval_seconds: 30
  global_proactive_min_gap_seconds: 5400   # 主动消息全局最小间隔：90分钟（±20% jitter，一次性采样，只增不减）；想更克制就调大。对应 admin PUT /scheduler/config 的 global_proactive_min_gap_hours=1.5。改后 ≤60s 内经 config 热加载生效，无需重启（core/config_loader.py mtime 检查）。
  max_daily_proactive: 8   # 当日主动消息总条数上限（ProactiveLedger，按 rhythm.py 逻辑日重置，5点前算前一天）；emergency 优先级触发器豁免但仍计入统计。
  gating_shadow:
    enabled: true
    max_size_mb: 5
    keep: 3
event_edge_proposer:
  # Disabled by default: only writes unreviewed candidate relations to the scoped evidence ledger.
  enabled: false
  cooldown_seconds: 21600
  event_window_size: 8
  max_candidates_per_run: 6
  max_daily_calls: 4
  max_daily_tokens: 1600
  max_tokens_per_call: 400
  # Bounds one discovered owner scope, including lock acquisition and model call.
  scope_timeout_seconds: 30
event_shadow_recall:
  # Disabled by default: the event-ledger path is diagnostic only and never
  # injects event text into the prompt.  uids/char_ids are optional greylist
  # overrides for a small rollout while enabled remains false.
  enabled: false
  uids: []
  char_ids: []
  seed_limit: 3
  window_before: 2
  window_after: 2
  max_related_per_seed: 4
  timeout_ms: 120
  max_trace_ids: 24
error:
  max_retries: 3
  retry_delay_seconds: 2
  fallback_message: 我现在有点累，等会儿再聊～
toy_autogrow:
  enabled: false           # true=他每轮判断后自主写入思考笔记；false=退回纯手动玩具
  min_interval_hours: 6   # 同一角色/用户最短写入间隔（小时）
  target: diary            # 写入目标文件键：diary=思考笔记，wishlist=愿望清单，doodle=涂鸦板

web_autosearch:
  enabled: false           # true=他可在author_note提示下自主调用web_search；false=纯反应式（用户明确要求才搜）
  min_interval_min: 30     # 自主搜索最短间隔（分钟），防止频繁搜索；用户明确触发不受此限

forensic_logs:
  max_size_mb: 5
  keep: 5
  event_log:
    day_archive_days: 30
    full_log_max_size_mb: 10
    full_log_keep: 3

performance_mapping:
  enabled: true        # false = enrich_say_segments 直接透传，行为与现在完全一致
  provider: rules       # rules | llm
  llm_timeout_sec: 3.0   # llm provider 外层超时，超时放弃标注直接下发
