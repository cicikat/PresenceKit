qq:
  enabled: false  # 需要 QQ 机器人再开，并配置 NapCat；纯桌宠用户保持关闭即可
  host: 127.0.0.1
  port: 3001
admin:
  enabled: true
  auto_start: true
  host: 127.0.0.1        # 默认仅本机可访问；局域网/公网访问需显式改成对应地址并配强口令（见下方 secret_key 说明）
  port: 8080             # 管理面板端口，浏览器访问 http://127.0.0.1:8080
  # 请改随机值，优先用环境变量 YEXUAN_ADMIN_SECRET（会覆盖这里的值）。
  # SEC-AUTH-2：这个值等价于 admin scope 的 bootstrap token（label legacy-admin），全权。
  # 边缘设备（手机/Watch/ESP32/手机轮询端）应改用 POST /auth/tokens 签发的最小权限 token
  # （P3 落地后可用；见 docs/security.md），不要把这个 secret_key 烧进边缘设备配置里。
  secret_key: YOUR_ADMIN_SECRET
deployment:
  mode: local  # local | remote_server; remote_server disables server-local OS/file capabilities
notify:
  # Conservative first-run default: startup must not send an unsolicited QQ notice.
  enabled: false
  target_qq: YOUR-TARGET-QQ
  message: 已上线，等你回来
# 手机后台推送唤醒中继（ntfy）。三项都填才生效；不填则后台推送只剩手机端每 6 小时的补偿轮询。
# 消息正文不经过中继，只发 wake 信号；手机收到信号后回源 /mobile/poll 拉正文。
# 自建 ntfy 参考 spike/push_relay_ntfy/server/docker-compose.yml（在手机端仓库）。
# App 端需在设置里填同一组 中继地址/topic/token。
relay_base_url: ""    # 例: https://ntfy.example.com 或局域网 http://192.168.x.x:8090
relay_topic: ""       # 例: yexuan-wake-a1b2c3（当作密码，用随机后缀）
relay_token: ""       # ntfy 访问 token；服务端开了鉴权才需要
emerald_desktop:
  path: YOUR-DESKTOP-PATH
proxy:
  enabled: false
  http: http://127.0.0.1:7897
  https: http://127.0.0.1:7897
tools:
