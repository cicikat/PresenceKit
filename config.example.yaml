# config.yaml 为程序管理：管理面板的 Setup/Settings 页读写的就是它，字段展开
# +注释被写回剥离属正常现象，不是文件损坏；字段含义请查本文件（config.example.yaml）。
# 两文件键集合由 scripts/gen_config_example.py 保持同步，改动配置项时记得重跑该脚本核对。

# ── 多模型 Preset 系统（推荐，见 docs/model-presets.md）──────────────────────
# 若不配此块，系统自动从下方 llm: 块合成等价行为（向后兼容）。
model_presets:
  active_routing: default          # 当前生效的路由方案名
  default_preset: deepseek-default # 未映射 / 新建 profile 未填的 category 先落到它，再回退 chat → 第一个 preset

  defaults:                        # 全局生成参数默认值
    temperature: 1.0
    top_p: 0.9
    max_tokens: 4000
    frequency_penalty: 0.3
    presence_penalty: 0.4

  presets:
    deepseek-default:
      provider_kind: deepseek
      api_protocol: chat_completions
      base_url: https://api.deepseek.com
      api_key: YOUR_DEEPSEEK_API_KEY
      model: deepseek-chat
      tool_call_mode: function_calling
      params:
        temperature: 1.0
        frequency_penalty: 0.3
        presence_penalty: 0.4

    claude-sonnet:
      provider_kind: anthropic_compat  # Claude 经 OpenAI 兼容层
      api_protocol: chat_completions
      base_url: https://your-oneapi.example/v1
      api_key: YOUR_ONEAPI_KEY
      model: claude-sonnet-4-6
      tool_call_mode: function_calling
      # prompt_style 省略 → anthropic_compat 默认 xml
      params:
        temperature: 0.8
        # frequency/presence_penalty 被白名单过滤，不会发给 API

    local-qwen:
      provider_kind: local
      api_protocol: chat_completions
      base_url: http://127.0.0.1:8000/v1
      api_key: none
      model: qwen2.5-72b-instruct
      tool_call_mode: xml_fallback
      prompt_style: narrative

    deepseek-reasoner:              # 原生 reasoning 示例（Brief 32）；无 function_calling
      provider_kind: deepseek
      api_protocol: chat_completions
      base_url: https://api.deepseek.com
      api_key: YOUR_DEEPSEEK_API_KEY
      model: deepseek-reasoner
      tool_call_mode: xml_fallback  # deepseek-reasoner 不支持 FC，与 tool loop 天然互斥
      reasoning_native: true        # 声明该 preset 有原生思考（thinking.mode=auto 时据此选 native）
      reasoning_extra_body: {}      # 原样经 OpenAI client 的 extra_body 透传，绕过参数白名单（逃生舱）；
                                     # 网关方言差异（o系 reasoning_effort、anthropic 网关 thinking budget
                                     # 等）自己按目标网关文档填，代码不做每家适配

    responses-example:              # 独立示例，不影响现有 routing
      provider_kind: openai
      api_protocol: responses
      base_url: https://api.example.invalid/v1
      api_key: YOUR_RESPONSES_API_KEY
      model: gpt-5.5
      tool_call_mode: function_calling

  routing_profiles:
    default:                       # 全 DeepSeek，等价旧行为
      chat:           deepseek-default
      intent:         deepseek-default
      scenario_reconcile: deepseek-default
      sensor_judge:   deepseek-default  # 后台 sensor 裁决：短超时、零 SDK 重试的独立调用策略
      probe:          deepseek-default
      summary:        deepseek-default
      detect_emotion: deepseek-default
      consolidation:  deepseek-default
      perform:        deepseek-default   # 句级表演意图映射（仅 performance_mapping.provider=llm 时使用）
      monologue:      deepseek-default   # 前置独白轻量调用（Brief 32）；显式指到便宜 preset，
                                          # 缺省会回落 chat 键走主力贵模型
      rpg_kp:         deepseek-default   # RPG Dream 中立裁决；缺省回落 chat

    claude-main:                   # 主对话走 Claude，杂活留 DS
      chat:           claude-sonnet
      intent:         deepseek-default
      scenario_reconcile: deepseek-default
      sensor_judge:   deepseek-default
      probe:          deepseek-default
      summary:        deepseek-default
      detect_emotion: deepseek-default
      consolidation:  deepseek-default
      perform:        deepseek-default
      monologue:      deepseek-default
      rpg_kp:         deepseek-default

# ── Legacy 扁平 llm: 块（向后兼容，无 model_presets 时生效）────────────────
llm:
  provider: deepseek
  api_key: YOUR_DEEPSEEK_API_KEY
  model: deepseek-chat
  base_url: https://api.deepseek.com
  tool_call_mode: function_calling
  temperature: 1
  top_p: 0.9
  max_tokens: 4000
  frequency_penalty: 0.3
  presence_penalty: 0.4
# High-sensitivity troubleshooting only.  When enabled, stores the semantic LLM
# request (messages, tools and generation params) for admin inspection.  Prompt
# content is retained, but credential-looking fields and image data URLs are
# redacted.  Keep disabled outside a short diagnostic window.
llm_debug_requests:
  enabled: false
  keep_days: 1
image_recognition:
  mode: vision  # vision | ocr; uploaded images only, not screen automation
  provider: glm
  api_protocol: glm_layout_parsing  # glm_layout_parsing | chat_completions
  model: glm-ocr
  endpoint_url: https://open.bigmodel.cn/api/paas/v4/layout_parsing
  base_url: ''  # only used by chat_completions
  api_key: ''
vision:
  enabled: false  # 纯增值功能(图片识别)，默认关；面板「系统状态」页可开，需自备 api_key
  provider: glm
  api_key: YOUR_VISION_API_KEY
  model: glm-4v-flash
  base_url: https://open.bigmodel.cn/api/paas/v4/
